        </div>

      <div class="content-shell">
        <header class="mobile-header">
          <a class="brand brand-mobile" href="#dashboard">

              </svg>
            </span>
            <span><strong>省实游泳队</strong><small>LOCAL</small></span>
          </a>

          <button class="bottom-nav-item" data-route="records"><svg viewBox="0 0 24 24"><path d="m3.5 18.49 6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99l1.5 1.5Z"/></svg><span>成绩</span></button>

    <dialog id="modal" class="modal">
      <form id="modalForm" method="dialog">
        <div class="modal-head">
          <div><span class="eyebrow">QUICK ENTRY</span><h2 id="modalTitle">添加</h2></div>
          <button class="icon-button" type="button" id="modalClose" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg></button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="button button-ghost" id="modalCancel">取消</button>
          <button type="submit" class="button button-primary" id="modalSubmit">保存</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=local1" defer></script>
